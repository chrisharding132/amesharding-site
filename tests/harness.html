<!doctype html>
<!-- Stand-in for Readymag page 2 at phone-portrait size: same widget boxes, same inline (non-iframe) embedding. -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#1b1830;} .w{position:absolute;}</style></head>
<body>
<!-- ?layout=desktop uses the desktop widget boxes (858x379 browser, 1023x49 player) -->
<div class="w" id="w-mb" style="left:15px;top:20px;width:291px;height:439px"><div id="ames-mb"></div></div>
<div class="w" id="w-pl" style="left:0;bottom:0;width:320px;height:78px"><div id="ames-player"></div></div>
<script>
  if (new URLSearchParams(location.search).get('layout') === 'desktop') {
    document.getElementById('w-mb').style.cssText = 'left:81px;top:30px;width:858px;height:379px';
    document.getElementById('w-pl').style.cssText = 'left:0;top:451px;width:1023px;height:49px';
  }
</script>
<script>
  // ?prefetch=none -> no Airtable; ?prefetch=fail -> rejected; default -> 3 synthetic records after 300ms
  var mode = new URLSearchParams(location.search).get('prefetch');
  function rec(t, type, tempo, x, y) { return { fields: { Title: t, Duration: '0:10', Type: type, Tempo: tempo, Tags: ['a', 'b'],
    'X (organic→electronic)': x, 'Y (dark→light)': y, 'Audio URL': '/tests/silence.wav?' + encodeURIComponent(t) } }; }
  if (mode === 'fail') window.__amesTracksPromise = Promise.resolve(null);
  else if (mode !== 'none') window.__amesTracksPromise = new Promise(function (r) { setTimeout(function () {
    var recs = [rec('One', 'vocal', 'slow', 0.1, 0.1), rec('Two', 'instrumental', 'mid', 0.5, 0.5), rec('Three', 'vocal', 'high', 0.9, 0.9)];
    if (mode === 'cluster') { recs = []; for (var i = 0; i < 28; i++) recs.push(rec('T' + i, 'vocal', 'mid', 0.3 + (i % 7) * 0.02, 0.4 + Math.floor(i / 7) * 0.03)); }
    r(recs); }, 300); });
</script>
<script src="/src/mood.js"></script>
<script src="/src/player.js"></script>
</body></html>
